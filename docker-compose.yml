services:

  # ==========================================================
  # KAFKA
  # ==========================================================

  kafka:
    image: apache/kafka:latest
    container_name: rag-kafka
    restart: unless-stopped

    ports:
      - "9092:9092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093

      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

    volumes:
      - kafka_data:/var/lib/kafka/data


  # ==========================================================
  # MONGODB
  # ==========================================================

  mongodb:
    image: mongo:8
    container_name: rag-mongodb
    restart: unless-stopped

    ports:
      - "27017:27017"

    environment:
      MONGO_INITDB_DATABASE: bluesky

    volumes:
      - mongodb_data:/data/db


  # ==========================================================
  # OLLAMA
  # ==========================================================

  ollama:
    image: ollama/ollama:latest
    container_name: rag-ollama
    restart: unless-stopped

    ports:
      - "11434:11434"

    volumes:
      - ollama_data:/root/.ollama


  # ==========================================================
  # QDRANT
  # ==========================================================

  qdrant:
    image: qdrant/qdrant:latest
    container_name: rag-qdrant
    restart: unless-stopped

    ports:
      - "6333:6333"
      - "6334:6334"

    volumes:
      - qdrant_data:/qdrant/storage


  # ==========================================================
  # PRODUCER
  # BLUESKY → KAFKA
  # ==========================================================

  producer:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: rag-producer
    restart: unless-stopped

    command:
      - python
      - app/producer.py

    depends_on:
      - kafka

    env_file:
      - .env


  # ==========================================================
  # CONSUMER
  # KAFKA → MONGODB
  # ==========================================================

  consumer:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: rag-consumer
    restart: unless-stopped

    command:
      - python
      - app/consumer.py

    depends_on:
      - kafka
      - mongodb

    env_file:
      - .env


  # ==========================================================
  # INGEST / PREPROCESSING
  # MONGODB → CLEAN POSTS
  # ==========================================================

  ingest:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: rag-ingest
    restart: unless-stopped

    command:
      - python
      - app/ingest.py

    depends_on:
      - mongodb

    env_file:
      - .env


  # ==========================================================
  # EMBEDDING
  # CLEAN POSTS → EMBEDDINGS
  # ==========================================================

  embedding:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: rag-embedding
    restart: unless-stopped

    command:
      - python
      - app/embedding.py

    depends_on:
      - mongodb
      - ollama

    env_file:
      - .env


  # ==========================================================
  # QDRANT INGESTION
  # EMBEDDINGS → QDRANT
  # ==========================================================

  qdrant-ingest:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: rag-qdrant-ingest
    restart: unless-stopped

    command:
      - python
      - app/qdrant_ingest.py

    depends_on:
      - mongodb
      - qdrant

    env_file:
      - .env


  # ==========================================================
  # FASTAPI
  # API → ask_rag() → QDRANT + OLLAMA
  # ==========================================================

  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: rag-api
    restart: unless-stopped

    command:
      - uvicorn
      - app.app:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"

    ports:
      - "8000:8000"

    depends_on:
      - qdrant
      - ollama

    env_file:
      - .env


  # ==========================================================
  # REACT FRONTEND
  # ==========================================================

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: rag-frontend
    restart: unless-stopped

    ports:
      - "5173:5173"

    depends_on:
      - api


# ============================================================
# VOLUMES
# ============================================================

volumes:
  kafka_data:
  mongodb_data:
  ollama_data:
  qdrant_data: