name: CI Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # 1. Récupérer le repository
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================================
      # 2. Installer Python
      # ==========================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # ==========================================================
      # 3. Installer les dépendances
      # ==========================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # ==========================================================
      # 4. Créer .env pour GitHub Actions
      # ==========================================================

      - name: Create .env
        run: |
          cat > .env <<'EOF'
          MONGO_URI=mongodb://mongodb:27017
          MONGO_DATABASE=bluesky
          MONGO_COLLECTION=posts

          OLLAMA_HOST=http://ollama:11434
          EMBEDDING_MODEL=nomic-embed-text
          EMBEDDING_POLL_INTERVAL=2

          QDRANT_HOST=qdrant
          QDRANT_PORT=6333
          QDRANT_COLLECTION=bluesky_posts
          QDRANT_BATCH_SIZE=100
          QDRANT_POLL_INTERVAL=2

          LLM_MODEL=qwen3:8b
          RAG_TOP_K=5
          EOF


      # ==========================================================
      # 5. Démarrer les services nécessaires
      # ==========================================================

      - name: Start MongoDB, Qdrant and Ollama
        run: |
          docker compose up -d mongodb qdrant ollama


      # ==========================================================
      # 6. Vérifier les conteneurs
      # ==========================================================

      - name: Check Docker services
        run: |
          docker compose ps


      # ==========================================================
      # 7. Attendre le démarrage des services
      # ==========================================================

      - name: Wait for services
        run: |
          sleep 20


      # ==========================================================
      # 8. Télécharger le modèle d'embedding Ollama
      # ==========================================================

      - name: Pull Ollama embedding model
        run: |
          docker compose exec -T ollama ollama pull nomic-embed-text


      # ==========================================================
      # 9. Vérifier Ollama
      # ==========================================================

      - name: Verify Ollama model
        run: |
          docker compose exec -T ollama ollama list


      # ==========================================================
      # 10. Vérifier Qdrant
      # ==========================================================

      - name: Verify Qdrant
        run: |
          curl --fail http://localhost:6333/collections


      # ==========================================================
      # 11. Vérifier MongoDB
      # ==========================================================

      - name: Verify MongoDB
        run: |
          docker compose exec -T mongodb mongosh --quiet --eval "db.adminCommand('ping')"


      # ==========================================================
      # 12. Lancer les tests
      # ==========================================================

      - name: Run pytest
        env:
          MONGO_URI: mongodb://localhost:27017
          MONGO_DATABASE: bluesky
          MONGO_COLLECTION: posts

          OLLAMA_HOST: http://localhost:11434
          EMBEDDING_MODEL: nomic-embed-text

          QDRANT_HOST: localhost
          QDRANT_PORT: "6333"
          QDRANT_COLLECTION: bluesky_posts

          LLM_MODEL: qwen3:8b
          RAG_TOP_K: "5"
        run: |
          pytest -v


      # ==========================================================
      # 13. Afficher les logs si un test échoue
      # ==========================================================

      - name: Show Docker logs on failure
        if: failure()
        run: |
          docker compose logs --no-color


      # ==========================================================
      # 14. Nettoyage
      # ==========================================================

      - name: Stop Docker services
        if: always()
        run: |
          docker compose down -v