name: CI Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:

    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # 1. Récupérer le projet
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================================
      # 2. Installer Python
      # ==========================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # ==========================================================
      # 3. Installer les dépendances
      # ==========================================================

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # ==========================================================
      # 4. Démarrer les services nécessaires aux tests
      # ==========================================================

      - name: Start MongoDB, Qdrant and Ollama
        run: |
          docker compose up -d mongodb qdrant ollama


      # ==========================================================
      # 5. Vérifier les conteneurs
      # ==========================================================

      - name: Check Docker services
        run: |
          docker compose ps


      # ==========================================================
      # 6. Attendre le démarrage des services
      # ==========================================================

      - name: Wait for services
        run: |
          sleep 20


      # ==========================================================
      # 7. Télécharger le modèle Ollama
      # ==========================================================

      - name: Pull Ollama embedding model
        run: |
          docker compose exec -T ollama ollama pull nomic-embed-text


      # ==========================================================
      # 8. Vérifier le modèle Ollama
      # ==========================================================

      - name: Verify Ollama model
        run: |
          docker compose exec -T ollama ollama list


      # ==========================================================
      # 9. Lancer les tests
      # ==========================================================

      - name: Run pytest
        env:
          OLLAMA_HOST: http://localhost:11434
          QDRANT_HOST: localhost
          QDRANT_PORT: "6333"
          MONGODB_HOST: localhost
          MONGODB_PORT: "27017"
        run: |
          pytest -v


      # ==========================================================
      # 10. Afficher les logs en cas d'échec
      # ==========================================================

      - name: Show Docker logs on failure
        if: failure()
        run: |
          docker compose logs --no-color


      # ==========================================================
      # 11. Nettoyer
      # ==========================================================

      - name: Stop Docker services
        if: always()
        run: |
          docker compose down -v